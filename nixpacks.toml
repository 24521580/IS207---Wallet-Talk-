# Railway Nixpacks Configuration for Laravel + Vite

[variables]
NIXPACKS_PHP_EXTENSIONS = "pdo_mysql,mbstring,tokenizer,xml,ctype,json,bcmath,curl,zip,fileinfo,openssl,gd"

[phases.setup]
nixPkgs = ["php83", "php83Packages.composer", "nodejs_20"]

[phases.build]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction",
  "npm ci || npm install",
  "npm run build",
  "mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache storage/logs bootstrap/cache",
  "chmod -R 775 storage bootstrap/cache"
]

[start]
cmd = "php artisan migrate --force && php artisan db:seed --class=CategorySeeder --force && php artisan config:clear && php artisan route:clear && php artisan view:clear && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
